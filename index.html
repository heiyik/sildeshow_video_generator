<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg.wasm 相片 Slideshow 產生器 (支援手機背景執行)</title>
    
    <!-- 全域攔截跨網域 Worker，自動轉為同源 Blob Worker -->
    <script>
        const OriginalWorker = window.Worker;
        window.Worker = function(scriptURL, options) {
            const urlStr = scriptURL.toString();
            if (urlStr.startsWith('http://') || urlStr.startsWith('https://')) {
                const blobCode = `importScripts("${urlStr}");`;
                const blob = new Blob([blobCode], { type: 'application/javascript' });
                return new OriginalWorker(URL.createObjectURL(blob), options);
            }
            return new OriginalWorker(scriptURL, options);
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <style>
        body {
            background-color: #DCE4EF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.5rem;
        }
        .badge {
            display: inline-block;
            background: #8e44ad;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            vertical-align: middle;
            margin-left: 6px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
        }
        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fafafa;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.25s;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .progress-container {
            margin-top: 25px;
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        progress {
            width: 100%;
            height: 22px;
            border-radius: 6px;
        }
        .log-box {
            margin-top: 12px;
            background: #1e272e;
            color: #0be881;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 6px;
            height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .result-container {
            margin-top: 25px;
            display: none;
            text-align: center;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        video {
            width: 100%;
            max-height: 480px;
            border-radius: 8px;
            background-color: black;
            margin-bottom: 15px;
        }
        .download-btn {
            background-color: #27ae60;
            text-decoration: none;
            color: white;
            padding: 12px 28px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>相片 Slideshow 產生器 <span class="badge">支援手機鎖屏背景執行</span></h1>
    
    <div class="form-group grid-2">
        <div>
            <label>1. 上傳相片資料夾 (Folder):</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*">
        </div>
        <div>
            <label>或 選擇多張相片 (手機建議用此項):</label>
            <input type="file" id="filesInput" multiple accept="image/*">
        </div>
    </div>

    <div class="form-group grid-2">
        <div>
            <label>2. 輸出影片格式:</label>
            <select id="formatInput">
                <option value="mp4">MP4 (H.264 - 100% 跨平台相容)</option>
                <option value="webm">WebM (VP8)</option>
            </select>
        </div>
        <div>
            <label>3. 輸出解像度 (16:9 自動補黑邊):</label>
            <select id="resInput">
                <option value="1920x1080">1080p Full HD (1920x1080)</option>
                <option value="1280x720">720p HD (1280x720 - 手機推薦)</option>
                <option value="3840x2160">4K Ultra HD (3840x2160)</option>
                <option value="auto">動態最高解像度 (自動偵測最大相片)</option>
            </select>
        </div>
    </div>

    <div class="form-group grid-2">
        <div>
            <label>4. 每張相片顯示時長 (秒):</label>
            <input type="number" id="durationInput" value="3" min="1" step="0.5">
        </div>
        <div>
            <label>5. 淡入淡出 Fade In/Out 時間 (秒):</label>
            <input type="number" id="transitionInput" value="0.8" min="0.2" step="0.1">
        </div>
    </div>

    <button id="startBtn">開始生成影片 (支援背景與鎖屏運行)</button>

    <div class="progress-container" id="progressContainer">
        <div class="status-header">
            <span id="statusText">準備中...</span>
            <span id="progressText">0%</span>
        </div>
        <progress id="progressBar" value="0" max="100"></progress>
        <div class="log-box" id="logBox">等待任務啟動...\n</div>
    </div>

    <div class="result-container" id="resultContainer">
        <h3>影片合成完成！</h3>
        <video id="previewVideo" controls playsinline></video>
        <br>
        <a id="downloadLink" class="download-btn" download="slideshow.mp4">下載高畫質影片</a>
    </div>
</div>

<canvas id="prepCanvas" style="display:none;"></canvas>

<script>
    const { FFmpeg } = FFmpegWASM;

    const folderInput = document.getElementById('folderInput');
    const filesInput = document.getElementById('filesInput');
    const formatInput = document.getElementById('formatInput');
    const resInput = document.getElementById('resInput');
    const durationInput = document.getElementById('durationInput');
    const transitionInput = document.getElementById('transitionInput');
    const startBtn = document.getElementById('startBtn');
    
    const progressContainer = document.getElementById('progressContainer');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const logBox = document.getElementById('logBox');
    
    const resultContainer = document.getElementById('resultContainer');
    const previewVideo = document.getElementById('previewVideo');
    const downloadLink = document.getElementById('downloadLink');
    const prepCanvas = document.getElementById('prepCanvas');
    const ctx = prepCanvas.getContext('2d');

    let imageFiles = [];
    let ffmpeg = null;

    // === 背景續命與防休眠模組 (Wake Lock + Web Audio Keep-Alive) ===
    let wakeLock = null;
    let keepAliveAudio = null;
    let audioCtx = null;

    // 產生一段 1 秒鐘極低音量的 WAV 音訊 Blob，欺騙手機系統目前正在播放媒體
    function createNearSilentWavBlob() {
        const sampleRate = 8000;
        const numSamples = sampleRate * 1;
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);
        const writeString = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + numSamples * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, numSamples * 2, true);
        // 填入極微弱的振幅 (1)，避免被 iOS/Android 判定為純靜音(0)而切斷背景權限
        for (let i = 0; i < numSamples; i++) {
            view.setInt16(44 + i * 2, (i % 2 === 0) ? 1 : -1, true);
        }
        return new Blob([buffer], { type: 'audio/wav' });
    }

    async function enableBackgroundExecution() {
        // 1. 啟動螢幕常亮鎖 (防止手機自動黑屏)
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                appendLog('[背景守護] 已啟用螢幕常亮鎖 (Screen Wake Lock)。');
            } catch (e) {}
        }

        // 2. 啟動無聲音樂播放器 (確保使用者手動鎖屏或切換 App 時，CPU 仍全速運作)
        try {
            if (!keepAliveAudio) {
                keepAliveAudio = new Audio(URL.createObjectURL(createNearSilentWavBlob()));
                keepAliveAudio.loop = true;
                keepAliveAudio.volume = 0.01;
            }
            await keepAliveAudio.play();

            // 註冊手機鎖屏通知列狀態，提升系統背景優先權
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: '正在背景合成 Slideshow 影片...',
                    artist: 'FFmpeg.wasm 背景引擎運作中',
                    album: '請勿關閉此瀏覽器分頁'
                });
                navigator.mediaSession.playbackState = 'playing';
            }
            appendLog('[背景守護] 已啟動背景音訊續命模式，現在鎖上螢幕或切換 App 仍會繼續運算！');
        } catch (e) {
            console.warn('背景音訊啟動失敗:', e);
        }
    }

    async function disableBackgroundExecution() {
        if (wakeLock) {
            try { await wakeLock.release(); } catch (e) {}
            wakeLock = null;
        }
        if (keepAliveAudio) {
            keepAliveAudio.pause();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'none';
            }
        }
        appendLog('[背景守護] 任務結束，已釋放背景與螢幕鎖定。');
    }
    // ==============================================================

    function appendLog(msg) {
        logBox.textContent += msg + '\n';
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateProgress(percent, status) {
        const p = Math.min(100, Math.max(0, Math.round(percent)));
        progressBar.value = p;
        progressText.textContent = p + '%';
        if (status) {
            statusText.textContent = status;
            // 同步更新手機鎖屏畫面上的進度標題
            if ('mediaSession' in navigator && navigator.mediaSession.metadata) {
                navigator.mediaSession.metadata.title = `[${p}%] ${status}`;
            }
        }
    }

    function handleFileSelect(e) {
        const files = Array.from(e.target.files).filter(file => file.type.startsWith('image/'));
        if (files.length > 0) {
            imageFiles = files;
            imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
            startBtn.textContent = `開始生成影片 (已排序 ${imageFiles.length} 張相片)`;
        }
    }

    folderInput.addEventListener('change', handleFileSelect);
    filesInput.addEventListener('change', handleFileSelect);

    function openCacheDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('FFmpegCacheDB', 1);
            req.onupgradeneeded = (e) => e.target.result.createObjectStore('files');
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = reject;
        });
    }

    async function getCachedBlob(key) {
        try {
            const db = await openCacheDB();
            return new Promise((resolve) => {
                const tx = db.transaction('files', 'readonly');
                const req = tx.objectStore('files').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        } catch { return null; }
    }

    async function setCachedBlob(key, blob) {
        try {
            const db = await openCacheDB();
            const tx = db.transaction('files', 'readwrite');
            tx.objectStore('files').put(blob, key);
        } catch (e) {}
    }

    async function fetchWithProgressAndCache(url, mimeType, label, startPct, endPct) {
        const cached = await getCachedBlob(url);
        if (cached) {
            appendLog(`[IndexedDB] 已從本機快取秒速載入 ${label}！`);
            updateProgress(endPct, `已從快取載入 ${label}`);
            return URL.createObjectURL(new Blob([cached], { type: mimeType }));
        }

        const response = await fetch(url);
        if (!response.ok) throw new Error(`無法下載 ${label} (${response.status})`);
        
        const contentLength = response.headers.get('content-length');
        if (!contentLength || !response.body) {
            const blob = await response.blob();
            await setCachedBlob(url, blob);
            return URL.createObjectURL(new Blob([blob], { type: mimeType }));
        }

        const total = parseInt(contentLength, 10);
        let loaded = 0;
        const reader = response.body.getReader();
        const chunks = [];

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;
            const ratio = loaded / total;
            const currentPct = startPct + ratio * (endPct - startPct);
            const mbLoaded = (loaded / 1024 / 1024).toFixed(1);
            const mbTotal = (total / 1024 / 1024).toFixed(1);
            updateProgress(currentPct, `正在下載 ${label}... (${mbLoaded} MB / ${mbTotal} MB)`);
        }

        const blob = new Blob(chunks, { type: mimeType });
        await setCachedBlob(url, blob);
        return URL.createObjectURL(blob);
    }

    async function initFFmpeg() {
        if (ffmpeg && ffmpeg.loaded) return;

        ffmpeg = new FFmpeg();
        ffmpeg.on('log', ({ message }) => {
            appendLog(message);
        });

        const coreBase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';

        const wasmBlobURL = await fetchWithProgressAndCache(
            `${coreBase}/ffmpeg-core.wasm`,
            'application/wasm',
            'FFmpeg WASM 引擎',
            2, 14
        );

        const coreBlobURL = await fetchWithProgressAndCache(
            `${coreBase}/ffmpeg-core.js`,
            'text/javascript',
            'FFmpeg Core JS',
            14, 16
        );

        updateProgress(17, '正在啟動 WebAssembly 虛擬機器...');
        await ffmpeg.load({
            coreURL: coreBlobURL,
            wasmURL: wasmBlobURL
        });
        appendLog('FFmpeg 核心啟動成功！');
    }

    function loadImageObj(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                resolve(img);
            };
            img.onerror = reject;
            img.src = url;
        });
    }

    function renderNormalizedImage(img, targetW, targetH) {
        prepCanvas.width = targetW;
        prepCanvas.height = targetH;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, targetW, targetH);

        const canvasAspect = targetW / targetH;
        const imgAspect = img.naturalWidth / img.naturalHeight;
        let w, h, x, y;

        if (imgAspect > canvasAspect) {
            w = targetW;
            h = targetW / imgAspect;
            x = 0;
            y = (targetH - h) / 2;
        } else {
            h = targetH;
            w = targetH * imgAspect;
            y = 0;
            x = (targetW - w) / 2;
        }

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, x, y, w, h);

        return new Promise((resolve) => {
            prepCanvas.toBlob(async (blob) => {
                const buf = await blob.arrayBuffer();
                resolve(new Uint8Array(buf));
            }, 'image/jpeg', 0.95);
        });
    }

    startBtn.addEventListener('click', async () => {
        if (imageFiles.length === 0) {
            alert('請先上傳相片資料夾或選擇多張相片！');
            return;
        }

        const duration = parseFloat(durationInput.value);
        const fadeTime = parseFloat(transitionInput.value);

        if (fadeTime * 2 >= duration) {
            alert('過場時間 (Fade In + Fade Out) 的總和不能大於或等於每張相片的顯示時長！');
            return;
        }

        startBtn.disabled = true;
        resultContainer.style.display = 'none';
        progressContainer.style.display = 'block';
        logBox.textContent = '';

        // 必須在使用者點擊按鈕的當下立刻啟動背景音訊與防休眠鎖
        await enableBackgroundExecution();

        try {
            await initFFmpeg();

            let targetW = 1920;
            let targetH = 1080;

            if (resInput.value === 'auto') {
                updateProgress(18, '正在掃描相片最高解像度...');
                let maxW = 1280, maxH = 720;
                for (const file of imageFiles) {
                    const img = await loadImageObj(file);
                    if (img.naturalWidth > maxW) maxW = img.naturalWidth;
                    if (img.naturalHeight > maxH) maxH = img.naturalHeight;
                }
                targetW = Math.min(3840, maxW);
                targetH = Math.round((targetW * 9) / 16);
            } else {
                const parts = resInput.value.split('x');
                targetW = parseInt(parts[0], 10);
                targetH = parseInt(parts[1], 10);
            }
            targetW = targetW % 2 === 0 ? targetW : targetW - 1;
            targetH = targetH % 2 === 0 ? targetH : targetH - 1;

            const totalImgs = imageFiles.length;

            // 階段一：趁使用者還在畫面上，優先將所有相片預處理並寫入 FFmpeg 記憶體
            // 這樣接下來就算鎖屏導致 DOM Canvas 被凍結，FFmpeg Worker 也能獨立在背景跑完！
            for (let i = 0; i < totalImgs; i++) {
                const prepPct = 20 + ((i + 1) / totalImgs) * 15;
                updateProgress(prepPct, `正在預先載入相片至記憶體 (${i + 1}/${totalImgs})...`);
                const img = await loadImageObj(imageFiles[i]);
                const imgBytes = await renderNormalizedImage(img, targetW, targetH);
                await ffmpeg.writeFile(`slide_${i}.jpg`, imgBytes);
            }

            appendLog('所有相片已寫入虛擬系統，現在您可以放心鎖上螢幕或切換至其他 App！');

            const format = formatInput.value;
            const ext = format === 'mp4' ? 'mp4' : 'webm';
            let concatListText = '';

            // 階段二：純 Worker 背景編碼迴圈 (完全不依賴 DOM 與 Canvas)
            for (let i = 0; i < totalImgs; i++) {
                const encodePct = 35 + (i / totalImgs) * 55;
                updateProgress(encodePct, `背景編碼中: 第 ${i + 1} / ${totalImgs} 張相片...`);

                const inputName = `slide_${i}.jpg`;
                const segName = `seg_${i}.${ext}`;
                const fadeOutStart = (duration - fadeTime).toFixed(2);
                const vfFilter = `fade=t=in:st=0:d=${fadeTime},fade=t=out:st=${fadeOutStart}:d=${fadeTime},format=yuv420p`;

                let ffmpegArgs = [];
                if (format === 'mp4') {
                    ffmpegArgs = [
                        '-loop', '1',
                        '-framerate', '30',
                        '-i', inputName,
                        '-t', duration.toString(),
                        '-vf', vfFilter,
                        '-c:v', 'libx264',
                        '-preset', 'ultrafast',
                        '-crf', '20',
                        segName
                    ];
                } else {
                    ffmpegArgs = [
                        '-loop', '1',
                        '-framerate', '30',
                        '-i', inputName,
                        '-t', duration.toString(),
                        '-vf', vfFilter,
                        '-c:v', 'libvpx',
                        '-b:v', '4M',
                        segName
                    ];
                }

                await ffmpeg.exec(ffmpegArgs);
                await ffmpeg.deleteFile(inputName);
                concatListText += `file '${segName}'\n`;
            }

            // 階段三：無損合併
            updateProgress(92, '正在無損合併所有影片片段...');
            await ffmpeg.writeFile('list.txt', concatListText);

            const outputFileName = `output.${ext}`;
            await ffmpeg.exec([
                '-f', 'concat',
                '-safe', '0',
                '-i', 'list.txt',
                '-c', 'copy',
                outputFileName
            ]);

            updateProgress(98, '正在匯出最終影片檔案...');
            const data = await ffmpeg.readFile(outputFileName);

            for (let i = 0; i < totalImgs; i++) {
                await ffmpeg.deleteFile(`seg_${i}.${ext}`);
            }
            await ffmpeg.deleteFile('list.txt');
            await ffmpeg.deleteFile(outputFileName);

            const mimeType = format === 'mp4' ? 'video/mp4' : 'video/webm';
            const videoBlob = new Blob([data.buffer], { type: mimeType });
            const videoURL = URL.createObjectURL(videoBlob);

            previewVideo.src = videoURL;
            downloadLink.href = videoURL;
            downloadLink.download = `slideshow_${targetW}x${targetH}.${ext}`;
            downloadLink.textContent = `下載高畫質影片 (${ext.toUpperCase()} - ${targetW}x${targetH})`;

            updateProgress(100, '影片合成完成！');
            resultContainer.style.display = 'block';

        } catch (err) {
            console.error(err);
            appendLog('\n[錯誤] ' + err.message);
            alert('生成過程中發生錯誤：' + err.message);
        } finally {
            await disableBackgroundExecution();
            startBtn.disabled = false;
        }
    });
</script>

</body>
</html>
