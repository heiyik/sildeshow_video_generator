<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純前端 Slideshow 影片生成器</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { text-align: center; margin-top: 0; color: #111827; }
        .upload-zone {
            border: 2px dashed #cbd5e1;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-zone:hover { border-color: var(--primary); background: #f0fdf4; }
        input[type="file"] { display: none; }
        
        .settings-zone {
            margin: 20px 0 10px 0;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .settings-zone label {
            font-weight: 600;
            color: #4b5563;
        }
        .settings-zone input {
            width: 70px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
        }

        .controls {
            margin: 15px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        .preview-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        canvas {
            background: #000;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .status {
            margin-top: 15px;
            font-weight: 500;
            color: #4b5563;
            font-size: 14px;
        }
        .file-count {
            margin-top: 10px;
            font-size: 14px;
            color: #059669;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 純前端相片資料夾轉影片 App</h1>
    
    <!-- 資料夾上載區域 -->
    <div class="upload-zone" onclick="document.getElementById('folderInput').click()">
        <p>📂 點擊這裡選擇包含相片的【資料夾】</p>
        <p style="font-size: 12px; color: #64748b;">(相片只會在本地處理，絕不上載伺服器)</p>
        <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*">
        <div class="file-count" id="fileCount"></div>
    </div>

    <!-- 參數設定區域 -->
    <div class="settings-zone">
        <label for="durationInput">⏱️ 每張相片顯示秒數：</label>
        <input type="number" id="durationInput" value="5" min="1" max="10" step="0.5">
        <span style="color: #64748b; font-size: 14px;">秒 (包含淡入淡出各 0.5 秒)</span>
    </div>

    <!-- 控制按鈕 -->
    <div class="controls">
        <button id="btnPreview" disabled>▶️ 預覽 Slideshow</button>
        <button id="btnRender" disabled>🎬 生成並下載影片</button>
    </div>

    <!-- 預覽畫布與狀態 -->
    <div class="preview-box">
        <canvas id="videoCanvas" width="1280" height="720"></canvas>
        <div class="status" id="statusText">請先選擇一個包含相片的資料夾。</div>
    </div>
</div>

<script>
    const folderInput = document.getElementById('folderInput');
    const durationInput = document.getElementById('durationInput');
    const btnPreview = document.getElementById('btnPreview');
    const btnRender = document.getElementById('btnRender');
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const fileCountText = document.getElementById('fileCount');

    let imageElements = []; // 存放預載入的 Image 物件
    let isPlaying = false;
    let animationFrameId = null;

    // 固定淡入淡出時長為 0.5 秒 (500 毫秒)
    const FADE_DURATION = 500;     
    const FPS = 30; // 錄製幀率

    // 獲取目前用戶設定的單張播放總時長 (毫秒)
    function getDisplayDuration() {
        let val = parseFloat(durationInput.value);
        if (isNaN(val) || val < 1) val = 5; // 防錯機制，預設 3 秒
        return val * 1000;
    }

    // 1. 監聽資料夾選取
    folderInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        // 過濾出圖片檔案，並按檔名排序
        const imgFiles = files.filter(file => file.type.startsWith('image/')).sort((a, b) => a.name.localeCompare(b.name));
        
        if (imgFiles.length === 0) {
            alert('找不到任何圖片檔案，請重新選取資料夾。');
            return;
        }

        fileCountText.innerText = `已成功讀取 ${imgFiles.length} 張相片，正在加載中...`;
        statusText.innerText = "正在讀取圖片，請稍候...";
        btnPreview.disabled = true;
        btnRender.disabled = true;

        // 預載入所有相片
        imageElements = [];
        for (let file of imgFiles) {
            try {
                const img = await loadImage(file);
                imageElements.push(img);
            } catch (err) {
                console.error("載入相片失敗: ", file.name);
            }
        }

        fileCountText.innerText = `✅ 成功載入 ${imageElements.length} 張相片！`;
        statusText.innerText = "就緒。您可以點擊「預覽」或直接「生成影片」。";
        btnPreview.disabled = false;
        btnRender.disabled = false;
        
        // 預先繪製第一張相片
        if (imageElements.length > 0) drawImageCover(imageElements[0], 1);
    });

    // 將 File 轉為 Image 物件的 Promise
    function loadImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // 2. 核心繪圖邏輯：自動適應比例裁剪 (Object-Fit: Cover) 加上不透明度控制
    function drawImageCover(img, alpha) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.globalAlpha = alpha;

        const canvasRatio = canvas.width / canvas.height;
        const imgRatio = img.width / img.height;
        let drawWidth, drawHeight, drawX, drawY;

        if (imgRatio > canvasRatio) {
            drawHeight = canvas.height;
            drawWidth = img.width * (canvas.height / img.height);
            drawX = (canvas.width - drawWidth) / 2;
            drawY = 0;
        } else {
            drawWidth = canvas.width;
            drawHeight = img.height * (canvas.width / img.width);
            drawX = 0;
            drawY = (canvas.height - drawHeight) / 2;
        }

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height); // 鋪黑底
        ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);
        ctx.restore();
    }

    // 計算特定時間點下，相片的透明度 (實現 Fade In / Fade Out)
    function getAlphaForTime(timeInImg, displayDuration) {
        if (timeInImg < FADE_DURATION) {
            // 淡入階段 (0 -> 1)
            return timeInImg / FADE_DURATION;
        } else if (timeInImg > displayDuration - FADE_DURATION) {
            // 淡出階段 (1 -> 0)
            return (displayDuration - timeInImg) / FADE_DURATION;
        }
        // 正常顯示
        return 1.0;
    }

    // 3. 預覽功能 (純播放，不錄影)
    btnPreview.addEventListener('click', () => {
        if (isPlaying) {
            stopPreview();
            return;
        }
        
        isPlaying = true;
        btnPreview.innerText = "⏹️ 停止預覽";
        btnRender.disabled = true;
        durationInput.disabled = true; // 播放時不允許更改設定
        
        let startTime = performance.now();
        const displayDuration = getDisplayDuration();
        const totalDuration = imageElements.length * displayDuration;

        function tick(now) {
            if (!isPlaying) return;
            let elapsed = now - startTime;

            if (elapsed >= totalDuration) {
                stopPreview();
                return;
            }

            let imgIndex = Math.floor(elapsed / displayDuration);
            let timeInImg = elapsed % displayDuration;
            let alpha = getAlphaForTime(timeInImg, displayDuration);

            drawImageCover(imageElements[imgIndex], alpha);
            statusText.innerText = `正在預覽：第 ${imgIndex + 1} / ${imageElements.length} 張相片`;

            animationFrameId = requestAnimationFrame(tick);
        }
        animationFrameId = requestAnimationFrame(tick);
    });

    function stopPreview() {
        isPlaying = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        btnPreview.innerText = "▶️ 預覽 Slideshow";
        btnRender.disabled = false;
