<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg.wasm 相片 Slideshow 產生器 (低記憶體防爆版)</title>

    <!-- 全域攔截跨網域 Worker，自動轉為同源 Blob Worker -->
    <script>
        const OriginalWorker = window.Worker;
        window.Worker = function(scriptURL, options) {
            const urlStr = scriptURL.toString();
            if (urlStr.startsWith('http://') || urlStr.startsWith('https://')) {
                const blobCode = `importScripts("${urlStr}");`;
                const blob = new Blob([blobCode], { type: 'application/javascript' });
                return new OriginalWorker(URL.createObjectURL(blob), options);
            }
            return new OriginalWorker(scriptURL, options);
        };
    </script>

    <!-- 支援 Client-side .heic / .heif 解碼 -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <style>
        body {
            background-color: #DCE4EF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.5rem;
        }
        .badge {
            display: inline-block;
            background: #27ae60;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            vertical-align: middle;
            margin-left: 6px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
        }
        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fafafa;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.25s;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .progress-container {
            margin-top: 25px;
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        progress {
            width: 100%;
            height: 22px;
            border-radius: 6px;
        }
        .log-box {
            margin-top: 12px;
            background: #1e272e;
            color: #0be881;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 6px;
            height: 160px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .result-container {
            margin-top: 25px;
            display: none;
            text-align: center;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        video {
            width: 100%;
            max-height: 480px;
            border-radius: 8px;
            background-color: black;
            margin-bottom: 15px;
        }
        .download-btn {
            background-color: #27ae60;
            text-decoration: none;
            color: white;
            padding: 12px 28px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>相片 Slideshow 產生器 <span class="badge">低記憶體防爆版 (每15張重啟釋放)</span></h1>
    
    <div class="form-group grid-2">
        <div>
            <label>1. 上傳相片資料夾 (Folder):</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*,.heic,.heif">
        </div>
        <div>
            <label>或 選擇多張相片 (支援 JPG / PNG / WebP / HEIC):</label>
            <input type="file" id="filesInput" multiple accept="image/*,.heic,.heif">
        </div>
    </div>

    <div class="form-group grid-2">
        <div>
            <label>2. 輸出影片格式:</label>
            <select id="formatInput">
                <option value="mp4">MP4 (H.264 - 100% 跨平台相容)</option>
                <option value="webm">WebM (VP8)</option>
            </select>
        </div>
        <div>
            <label>3. 輸出解像度 (16:9 自動補黑邊):</label>
            <select id="resInput">
                <option value="1920x1080" selected>1080p Full HD (1920x1080)</option>
                <option value="1280x720">720p HD (1280x720 - 舊機最穩最快)</option>
                <option value="auto">動態最高解像度 (自動偵測最大相片)</option>
                <option value="3840x2160">4K Ultra HD (3840x2160)</option>
            </select>
        </div>
    </div>

    <div class="form-group grid-2">
        <div>
            <label>4. 每張相片顯示時長 (秒):</label>
            <input type="number" id="durationInput" value="3" min="1" step="0.5">
        </div>
        <div>
            <label>5. 淡入淡出 Fade In/Out 時間 (秒):</label>
            <input type="number" id="transitionInput" value="0.8" min="0.2" step="0.1">
        </div>
    </div>

    <button id="startBtn">開始生成影片 (支援背景與鎖屏運行)</button>

    <div class="progress-container" id="progressContainer">
        <div class="status-header">
            <span id="statusText">準備中...</span>
            <span id="progressText">0%</span>
        </div>
        <progress id="progressBar" value="0" max="100"></progress>
        <div class="log-box" id="logBox">等待任務啟動...\n</div>
    </div>

    <div class="result-container" id="resultContainer">
        <h3>影片合成完成！</h3>
        <video id="previewVideo" controls playsinline></video>
        <br>
        <a id="downloadLink" class="download-btn" download="slideshow.mp4">下載高畫質影片</a>
    </div>
</div>

<canvas id="prepCanvas" style="display:none;"></canvas>

<script>
    const { FFmpeg } = FFmpegWASM;

    const folderInput = document.getElementById('folderInput');
    const filesInput = document.getElementById('filesInput');
    const formatInput = document.getElementById('formatInput');
    const resInput = document.getElementById('resInput');
    const durationInput = document.getElementById('durationInput');
    const transitionInput = document.getElementById('transitionInput');
    const startBtn = document.getElementById('startBtn');
    
    const progressContainer = document.getElementById('progressContainer');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const logBox = document.getElementById('logBox');
    
    const resultContainer = document.getElementById('resultContainer');
    const previewVideo = document.getElementById('previewVideo');
    const downloadLink = document.getElementById('downloadLink');
    const prepCanvas = document.getElementById('prepCanvas');
    const ctx = prepCanvas.getContext('2d');

    let imageFiles = [];
    let ffmpeg = null;
    let cachedWasmBlobURL = null;
    let cachedCoreBlobURL = null;

    // 每處理 15 張相片就銷毀並重啟 FFmpeg Worker，徹底清空 2GB WASM 記憶體
    const BATCH_SIZE = 15;

    function formatError(err) {
        if (err === undefined) return '未知例外 (收到 undefined，可能為記憶體不足或 Worker 中斷)';
        if (err === null) return '未知例外 (收到 null)';
        if (typeof err === 'string') return err;
        if (err instanceof Error) {
            return err.message ? `${err.message}${err.stack ? '\n' + err.stack : ''}` : String(err);
        }
        try {
            return JSON.stringify(err);
        } catch (_) {
            return String(err);
        }
    }

    // === 背景續命與防休眠模組 (Wake Lock + Web Audio Keep-Alive) ===
    let wakeLock = null;
    let keepAliveAudio = null;

    function createNearSilentWavBlob() {
        const sampleRate = 8000;
        const numSamples = sampleRate * 1;
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);
        const writeString = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + numSamples * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, numSamples * 2, true);
        for (let i = 0; i < numSamples; i++) {
            view.setInt16(44 + i * 2, (i % 2 === 0) ? 1 : -1, true);
        }
        return new Blob([buffer], { type: 'audio/wav' });
    }

    async function enableBackgroundExecution() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                appendLog('[背景守護] 已啟用螢幕常亮鎖 (Screen Wake Lock)。');
            } catch (e) {}
        }

        try {
            if (!keepAliveAudio) {
                keepAliveAudio = new Audio(URL.createObjectURL(createNearSilentWavBlob()));
                keepAliveAudio.loop = true;
                keepAliveAudio.volume = 0.01;
            }
            await keepAliveAudio.play();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: '正在背景合成 Slideshow 影片...',
                    artist: 'FFmpeg.wasm 低記憶體引擎運作中',
                    album: '請勿關閉此瀏覽器分頁'
                });
                navigator.mediaSession.playbackState = 'playing';
            }
            appendLog('[背景守護] 已啟動背景音訊續命模式。');
        } catch (e) {
            console.warn('背景音訊啟動失敗:', e);
        }
    }

    async function disableBackgroundExecution() {
        if (wakeLock) {
            try { await wakeLock.release(); } catch (e) {}
            wakeLock = null;
        }
        if (keepAliveAudio) {
            keepAliveAudio.pause();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'none';
            }
        }
        appendLog('[背景守護] 任務結束，已釋放背景與螢幕鎖定。');
    }
    // ==============================================================

    function appendLog(msg) {
        logBox.textContent += msg + '\n';
        // 限制日誌長度，避免長時間執行導致 DOM 文字節點過大佔用記憶體
        if (logBox.textContent.length > 25000) {
            logBox.textContent = logBox.textContent.slice(-15000);
        }
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateProgress(percent, status) {
        const p = Math.min(100, Math.max(0, Math.round(percent)));
        progressBar.value = p;
        progressText.textContent = p + '%';
        if (status) {
            statusText.textContent = status;
            if ('mediaSession' in navigator && navigator.mediaSession.metadata) {
                navigator.mediaSession.metadata.title = `[${p}%] ${status}`;
            }
        }
    }

    function isSupportedImageFile(file) {
        const lowerName = (file.name || '').toLowerCase();
        return (
            (file.type && file.type.startsWith('image/')) ||
            lowerName.endsWith('.heic') ||
            lowerName.endsWith('.heif')
        );
    }

    async function isRealHeicFile(file) {
        const lowerName = (file.name || '').toLowerCase();
        const lowerType = (file.type || '').toLowerCase();
        const looksLikeHeic =
            lowerName.endsWith('.heic') ||
            lowerName.endsWith('.heif') ||
            lowerType === 'image/heic' ||
            lowerType === 'image/heif';

        if (!looksLikeHeic) return false;

        try {
            const headerSlice = file.slice(0, 16);
            const buf = await headerSlice.arrayBuffer();
            const bytes = new Uint8Array(buf);

            if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) return false;
            if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) return false;

            const ftyp = String.fromCharCode(bytes[4] || 0, bytes[5] || 0, bytes[6] || 0, bytes[7] || 0);
            if (ftyp === 'ftyp') {
                const brand = String.fromCharCode(bytes[8] || 0, bytes[9] || 0, bytes[10] || 0, bytes[11] || 0).toLowerCase();
                return ['heic', 'heix', 'hevc', 'hevx', 'mif1', 'msf1'].includes(brand);
            }
            return true;
        } catch (_) {
            return true;
        }
    }

    async function tryConvertHeic(file) {
        if (typeof heic2any === 'undefined') return null;
        try {
            appendLog(`[HEIC 轉換] 正在解碼 ${file.name}...`);
            const converted = await heic2any({
                blob: file,
                toType: 'image/jpeg',
                quality: 0.92
            });
            return Array.isArray(converted) ? converted[0] : converted;
        } catch (err) {
            appendLog(`[警告] heic2any 無法解析 ${file.name}，嘗試原生圖片讀取...`);
            return null;
        }
    }

    function loadBlobToImage(blob) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(blob);
            img.onload = () => {
                URL.revokeObjectURL(url);
                resolve(img);
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error('Image element decode failed'));
            };
            img.src = url;
        });
    }

    async function loadImageObj(file) {
        if (await isRealHeicFile(file)) {
            const convertedBlob = await tryConvertHeic(file);
            if (convertedBlob) {
                try {
                    return await loadBlobToImage(convertedBlob);
                } catch (_) {}
            }
        }

        try {
            return await loadBlobToImage(file);
        } catch (_) {
            appendLog(`[跳過] 無法解碼檔案 ${file.name}（可能已損壞或非有效圖片）。`);
            return null;
        }
    }

    function handleFileSelect(e) {
        const files = Array.from(e.target.files).filter(isSupportedImageFile);
        if (files.length > 0) {
            imageFiles = files;
            imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
            startBtn.textContent = `開始生成影片 (已排序 ${imageFiles.length} 張相片)`;
        }
    }

    folderInput.addEventListener('change', handleFileSelect);
    filesInput.addEventListener('change', handleFileSelect);

    function openCacheDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('FFmpegCacheDB', 1);
            req.onupgradeneeded = (e) => e.target.result.createObjectStore('files');
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = reject;
        });
    }

    async function getCachedBlob(key) {
        try {
            const db = await openCacheDB();
            return new Promise((resolve) => {
                const tx = db.transaction('files', 'readonly');
                const req = tx.objectStore('files').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        } catch { return null; }
    }

    async function setCachedBlob(key, blob) {
        try {
            const db = await openCacheDB();
            const tx = db.transaction('files', 'readwrite');
            tx.objectStore('files').put(blob, key);
        } catch (e) {}
    }

    async function fetchWithProgressAndCache(url, mimeType, label, startPct, endPct) {
        const cached = await getCachedBlob(url);
        if (cached) {
            appendLog(`[IndexedDB] 已從本機快取載入 ${label}！`);
            updateProgress(endPct, `已從快取載入 ${label}`);
            return URL.createObjectURL(new Blob([cached], { type: mimeType }));
        }

        const response = await fetch(url);
        if (!response.ok) throw new Error(`無法下載 ${label} (${response.status})`);
        
        const contentLength = response.headers.get('content-length');
        if (!contentLength || !response.body) {
            const blob = await response.blob();
            await setCachedBlob(url, blob);
            return URL.createObjectURL(new Blob([blob], { type: mimeType }));
        }

        const total = parseInt(contentLength, 10);
        let loaded = 0;
        const reader = response.body.getReader();
        const chunks = [];

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;
            const ratio = loaded / total;
            const currentPct = startPct + ratio * (endPct - startPct);
            const mbLoaded = (loaded / 1024 / 1024).toFixed(1);
            const mbTotal = (total / 1024 / 1024).toFixed(1);
            updateProgress(currentPct, `正在下載 ${label}... (${mbLoaded} MB / ${mbTotal} MB)`);
        }

        const blob = new Blob(chunks, { type: mimeType });
        await setCachedBlob(url, blob);
        return URL.createObjectURL(blob);
    }

    // 預先準備 WASM 與 Core JS 的 Blob URL（之後每次重啟 Worker 只需 0.5 秒）
    async function ensureFFmpegAssets() {
        const coreBase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
        if (!cachedWasmBlobURL) {
            cachedWasmBlobURL = await fetchWithProgressAndCache(
                `${coreBase}/ffmpeg-core.wasm`,
                'application/wasm',
                'FFmpeg WASM 引擎',
                2, 14
            );
        }
        if (!cachedCoreBlobURL) {
            cachedCoreBlobURL = await fetchWithProgressAndCache(
                `${coreBase}/ffmpeg-core.js`,
                'text/javascript',
                'FFmpeg Core JS',
                14, 16
            );
        }
    }

    // 徹底銷毀舊 Worker 並啟動一個 100% 乾淨記憶體的新 FFmpeg 實例
    async function startFreshFFmpeg() {
        if (ffmpeg) {
            try { ffmpeg.terminate(); } catch (_) {}
            ffmpeg = null;
        }
        // 給瀏覽器一點時間回收舊 Worker 的記憶體
        await new Promise(r => setTimeout(r, 100));

        ffmpeg = new FFmpeg();
        ffmpeg.on('log', ({ message }) => {
            // 只顯示重要訊息，減少大量 frame log 拖慢舊機
            if (message.includes('Error') || message.includes('error') || message.includes('Output #0')) {
                appendLog(message);
            }
        });

        await ffmpeg.load({
            coreURL: cachedCoreBlobURL,
            wasmURL: cachedWasmBlobURL
        });
    }

    function terminateFFmpeg() {
        if (ffmpeg) {
            try { ffmpeg.terminate(); } catch (_) {}
            ffmpeg = null;
        }
    }

    function renderNormalizedImage(img, targetW, targetH) {
        prepCanvas.width = targetW;
        prepCanvas.height = targetH;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, targetW, targetH);

        const canvasAspect = targetW / targetH;
        const imgAspect = img.naturalWidth / img.naturalHeight;
        let w, h, x, y;

        if (imgAspect > canvasAspect) {
            w = targetW;
            h = targetW / imgAspect;
            x = 0;
            y = (targetH - h) / 2;
        } else {
            h = targetH;
            w = targetH * imgAspect;
            y = 0;
            x = (targetW - w) / 2;
        }

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, x, y, w, h);

        return new Promise((resolve) => {
            prepCanvas.toBlob(async (blob) => {
                const buf = await blob.arrayBuffer();
                resolve(new Uint8Array(buf));
            }, 'image/jpeg', 0.85);
        });
    }

    startBtn.addEventListener('click', async () => {
        if (imageFiles.length === 0) {
            alert('請先上傳相片資料夾或選擇多張相片！');
            return;
        }

        const duration = parseFloat(durationInput.value);
        const fadeTime = parseFloat(transitionInput.value);

        if (fadeTime * 2 >= duration) {
            alert('過場時間 (Fade In + Fade Out) 的總和不能大於或等於每張相片的顯示時長！');
            return;
        }

        startBtn.disabled = true;
        resultContainer.style.display = 'none';
        progressContainer.style.display = 'block';
        logBox.textContent = '';

        await enableBackgroundExecution();

        try {
            await ensureFFmpegAssets();

            // 1. 決定目標解像度
            let targetW = 1920;
            let targetH = 1080;

            if (resInput.value === 'auto') {
                updateProgress(17, '正在掃描相片最高解像度...');
                let maxW = 1280;
                for (let i = 0; i < imageFiles.length; i++) {
                    const img = await loadImageObj(imageFiles[i]);
                    if (img) {
                        if (img.naturalWidth > maxW) maxW = img.naturalWidth;
                        img.src = '';
                    }
                    if (i % 10 === 0) {
                        updateProgress(17 + (i / imageFiles.length) * 3, `掃描解像度中 (${i + 1}/${imageFiles.length})...`);
                        await new Promise(r => setTimeout(r, 0));
                    }
                }
                targetW = Math.min(3840, maxW);
                targetH = Math.round((targetW * 9) / 16);
            } else {
                const parts = resInput.value.split('x');
                targetW = parseInt(parts[0], 10);
                targetH = parseInt(parts[1], 10);
            }
            targetW = targetW % 2 === 0 ? targetW : targetW - 1;
            targetH = targetH % 2 === 0 ? targetH : targetH - 1;

            const format = formatInput.value;
            const ext = format === 'mp4' ? 'mp4' : 'webm';
            const mimeType = format === 'mp4' ? 'video/mp4' : 'video/webm';
            const fadeOutStart = Math.max(0, duration - fadeTime).toFixed(2);
            const vfFilter = `fade=t=in:st=0:d=${fadeTime},fade=t=out:st=${fadeOutStart}:d=${fadeTime},format=yuv420p`;

            const totalFiles = imageFiles.length;
            const totalBatches = Math.ceil(totalFiles / BATCH_SIZE);
            const batchBlobs = []; // 存放在 WASM 外部的批次影片 Blob

            appendLog(`目標解像度: ${targetW}x${targetH}，共 ${totalFiles} 張相片，將分為 ${totalBatches} 批處理（每批 ${BATCH_SIZE} 張後重啟釋放記憶體）。`);

            // 2. 分批處理迴圈：每批啟動全新 FFmpeg -> 編碼 -> 合併 -> 搬出 Blob -> 銷毀 FFmpeg
            for (let b = 0; b < totalBatches; b++) {
                const startIdx = b * BATCH_SIZE;
                const endIdx = Math.min(startIdx + BATCH_SIZE, totalFiles);

                appendLog(`\n--- [第 ${b + 1}/${totalBatches} 批] 啟動全新 FFmpeg Worker (相片 ${startIdx + 1} ~ ${endIdx}) ---`);
                await startFreshFFmpeg();

                const segNames = [];

                for (let i = startIdx; i < endIdx; i++) {
                    const pct = 20 + (i / totalFiles) * 70;
                    updateProgress(pct, `[第 ${b + 1}/${totalBatches} 批] 處理第 ${i + 1} / ${totalFiles} 張 (${imageFiles[i].name})...`);

                    const img = await loadImageObj(imageFiles[i]);
                    if (!img) continue;

                    const imgBytes = await renderNormalizedImage(img, targetW, targetH);
                    img.src = '';

                    const inputName = `slide_${i}.jpg`;
                    const segName = `seg_${i}.${ext}`;
                    await ffmpeg.writeFile(inputName, imgBytes);

                    let ffmpegArgs = [];
                    if (format === 'mp4') {
                        ffmpegArgs = [
                            '-loop', '1',
                            '-framerate', '30',
                            '-i', inputName,
                            '-t', duration.toString(),
                            '-vf', vfFilter,
                            '-c:v', 'libx264',
                            '-preset', 'ultrafast',
                            '-crf', '22',
                            '-movflags', '+faststart',
                            segName
                        ];
                    } else {
                        ffmpegArgs = [
                            '-loop', '1',
                            '-framerate', '30',
                            '-i', inputName,
                            '-t', duration.toString(),
                            '-vf', vfFilter,
                            '-c:v', 'libvpx',
                            '-b:v', '4M',
                            segName
                        ];
                    }

                    await ffmpeg.exec(ffmpegArgs);
                    await ffmpeg.deleteFile(inputName);
                    segNames.push(segName);
                }

                // 將本批次的片段無損合併，並搬出至外部 Blob
                if (segNames.length > 0) {
                    const batchOutName = `batch_${b}.${ext}`;
                    if (segNames.length === 1) {
                        const data = await ffmpeg.readFile(segNames[0]);
                        batchBlobs.push(new Blob([data.buffer], { type: mimeType }));
                    } else {
                        const listContent = segNames.map(name => `file '${name}'`).join('\n') + '\n';
                        await ffmpeg.writeFile('batch_list.txt', listContent);
                        await ffmpeg.exec([
                            '-f', 'concat',
                            '-safe', '0',
                            '-i', 'batch_list.txt',
                            '-c', 'copy',
                            batchOutName
                        ]);
                        const data = await ffmpeg.readFile(batchOutName);
                        batchBlobs.push(new Blob([data.buffer], { type: mimeType }));
                    }
                    appendLog(`[第 ${b + 1}/${totalBatches} 批] 完成！已搬出至外部記憶體，正在銷毀 Worker 釋放 RAM...`);
                }

                // 強制終止 Worker，100% 釋放 2GB WASM 線性記憶體！
                terminateFFmpeg();
            }

            if (batchBlobs.length === 0) {
                throw new Error('沒有任何可成功解碼的有效相片。');
            }

            // 3. 最終合併所有外部批次 Blob
            let finalVideoBlob = null;

            if (batchBlobs.length === 1) {
                finalVideoBlob = batchBlobs[0];
            } else {
                updateProgress(92, `正在啟動乾淨 Worker 無損合併 ${batchBlobs.length} 個批次影片...`);
                appendLog(`\n--- 最終無損合併 (${batchBlobs.length} 個批次檔) ---`);
                await startFreshFFmpeg();

                let finalListContent = '';
                for (let b = 0; b < batchBlobs.length; b++) {
                    const bName = `batch_${b}.${ext}`;
                    const buf = await batchBlobs[b].arrayBuffer();
                    await ffmpeg.writeFile(bName, new Uint8Array(buf));
                    finalListContent += `file '${bName}'\n`;
                }
                // 釋放外部批次 Blob 陣列
                batchBlobs.length = 0;

                await ffmpeg.writeFile('final_list.txt', finalListContent);
                const outputFileName = `output.${ext}`;
                await ffmpeg.exec([
                    '-f', 'concat',
                    '-safe', '0',
                    '-i', 'final_list.txt',
                    '-c', 'copy',
                    outputFileName
                ]);

                updateProgress(98, '正在匯出最終影片檔案...');
                const finalData = await ffmpeg.readFile(outputFileName);
                finalVideoBlob = new Blob([finalData.buffer], { type: mimeType });
                terminateFFmpeg();
            }

            const videoURL = URL.createObjectURL(finalVideoBlob);
            previewVideo.src = videoURL;
            downloadLink.href = videoURL;
            downloadLink.download = `slideshow_${targetW}x${targetH}.${ext}`;
            downloadLink.textContent = `下載高畫質影片 (${ext.toUpperCase()} - ${targetW}x${targetH})`;

            updateProgress(100, '影片合成完成！');
            appendLog('全部完成！');
            resultContainer.style.display = 'block';

        } catch (err) {
            const errMsg = formatError(err);
            console.error('Slideshow generation error:', err);
            appendLog('\n[錯誤] ' + errMsg);
            alert('生成過程中發生錯誤：' + errMsg);
        } finally {
            terminateFFmpeg();
            await disableBackgroundExecution();
            startBtn.disabled = false;
        }
    });
</script>
