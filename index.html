<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相片 Slideshow 影片產生器</title>
    <style>
        body {
            background-color: #DCE4EF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .file-inputs {
            display: flex;
            gap: 15px;
        }
        .file-inputs > div {
            flex: 1;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        progress {
            width: 100%;
            height: 20px;
        }
        .result-container {
            margin-top: 20px;
            display: none;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background-color: black;
            margin-bottom: 15px;
        }
        .download-btn {
            background-color: #27ae60;
            text-decoration: none;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #2ecc71;
        }
        /* 隱藏用於渲染的 Canvas */
        #renderCanvas {
            display: none; 
        }
        .note {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>相片 Slideshow 影片產生器</h1>
    
    <div class="form-group file-inputs">
        <div>
            <label>1. 上傳相片資料夾 (Folder):</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*">
        </div>
        <div>
            <label>或 選擇多張相片 (Files):</label>
            <input type="file" id="filesInput" multiple accept="image/*">
        </div>
    </div>

    <div class="form-group">
        <label>2. 輸出影片格式:</label>
        <select id="formatInput">
            <option value="webm">WebM (相容性最佳)</option>
            <option value="mp4">MP4 (H.264)</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. 每張相片顯示時長 (秒):</label>
        <input type="number" id="durationInput" value="3" min="1" step="0.5">
    </div>

    <div class="form-group">
        <label>4. 過場 Fade In/Out 時間 (秒):</label>
        <input type="number" id="transitionInput" value="1" min="0.1" step="0.1">
    </div>

    <button id="startBtn">開始生成影片</button>

    <div class="progress-container" id="progressContainer">
        <label>影片錄製中 (實時渲染)... <span id="progressText">0%</span></label>
        <progress id="progressBar" value="0" max="100"></progress>
        <p class="note">* MediaRecorder API 需要實時錄製，請耐心等候。</p>
    </div>

    <div class="result-container" id="resultContainer">
        <h3>錄製完成！</h3>
        <video id="previewVideo" controls></video>
        <br>
        <a id="downloadLink" class="download-btn" download="slideshow.webm">下載影片</a>
    </div>
</div>

<canvas id="renderCanvas" width="1920" height="1080"></canvas>

<script>
    const folderInput = document.getElementById('folderInput');
    const filesInput = document.getElementById('filesInput');
    const formatInput = document.getElementById('formatInput');
    const durationInput = document.getElementById('durationInput');
    const transitionInput = document.getElementById('transitionInput');
    const startBtn = document.getElementById('startBtn');
    
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    
    const resultContainer = document.getElementById('resultContainer');
    const previewVideo = document.getElementById('previewVideo');
    const downloadLink = document.getElementById('downloadLink');
    
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');

    let imageFiles = [];
    let loadedImages = [];
    let mediaRecorder;
    let recordedChunks = [];
    let animationId;

    // 頁面載入時，檢查瀏覽器是否支援 MP4 錄製
    window.addEventListener('DOMContentLoaded', () => {
        const mp4Option = formatInput.querySelector('option[value="mp4"]');
        if (!MediaRecorder.isTypeSupported('video/mp4')) {
            mp4Option.disabled = true;
            mp4Option.textContent = 'MP4 (您的瀏覽器不支援直接產出)';
        }
    });

    // 處理檔案選擇
    function handleFileSelect(e) {
        const files = Array.from(e.target.files).filter(file => file.type.startsWith('image/'));
        if (files.length > 0) {
            imageFiles = files;
            // 按檔名自然排序 (支援數字順序如 1.jpg, 2.jpg, 10.jpg)
            imageFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
            startBtn.textContent = `開始生成影片 (已選擇 ${imageFiles.length} 張相片)`;
        }
    }

    folderInput.addEventListener('change', handleFileSelect);
    filesInput.addEventListener('change', handleFileSelect);

    // 載入所有圖片至 Image 物件
    async function loadImages() {
        loadedImages = [];
        for (const file of imageFiles) {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            await new Promise((resolve) => {
                img.onload = resolve;
                img.onerror = resolve; // 忽略損壞的圖片
            });
            loadedImages.push(img);
        }
    }

    // 保持圖片比例並置中繪製 (Letterbox)
    function drawImageLetterbox(img, alpha) {
        const canvasAspect = canvas.width / canvas.height;
        const imgAspect = img.width / img.height;
        let w, h, x, y;

        if (imgAspect > canvasAspect) {
            w = canvas.width;
            h = canvas.width / imgAspect;
            x = 0;
            y = (canvas.height - h) / 2;
        } else {
            h = canvas.height;
            w = canvas.height * imgAspect;
            y = 0;
            x = (canvas.width - w) / 2;
        }

        ctx.globalAlpha = alpha;
        ctx.drawImage(img, x, y, w, h);
        ctx.globalAlpha = 1.0; 
    }

    startBtn.addEventListener('click', async () => {
        if (imageFiles.length === 0) {
            alert('請先上傳相片資料夾或多張相片！');
            return;
        }

        const durationPerImage = parseFloat(durationInput.value) * 1000;
        const transitionTime = parseFloat(transitionInput.value) * 1000;

        if (transitionTime >= durationPerImage) {
            alert('過場時間必須小於每張相片的顯示時長！');
            return;
        }

        // 初始化 UI
        startBtn.disabled = true;
        resultContainer.style.display = 'none';
        progressContainer.style.display = 'block';
        progressBar.value = 0;
        progressText.innerText = '載入圖片中...';

        await loadImages();
        
        if (loadedImages.length === 0) {
            alert('無法載入有效的圖片。');
            startBtn.disabled = false;
            return;
        }

        const totalDuration = loadedImages.length * durationPerImage;
        let startTime = null;
        recordedChunks = [];

        // 設置 Canvas 錄製串流 (30 FPS)
        const stream = canvas.captureStream(30);
        
        // 根據使用者選擇設定 MimeType
        let options = {};
        let fileExtension = formatInput.value;
        const selectedFormat = formatInput.value;

        if (selectedFormat === 'mp4' && MediaRecorder.isTypeSupported('video/mp4')) {
            options = { mimeType: 'video/mp4' };
        } else {
            // WebM fallback：優先嘗試使用 H.264 編碼的 WebM (畫質/相容性較佳)，其次才用預設 WebM
            if (MediaRecorder.isTypeSupported('video/webm; codecs=h264')) {
                options = { mimeType: 'video/webm; codecs=h264' };
            } else {
                options = { mimeType: 'video/webm' };
            }
            fileExtension = 'webm';
        }
        
        mediaRecorder = new MediaRecorder(stream, options);

        mediaRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: options.mimeType });
            const videoURL = URL.createObjectURL(blob);
            
            previewVideo.src = videoURL;
            downloadLink.href = videoURL;
            
            // 更新下載按鈕資訊
            downloadLink.download = `slideshow.${fileExtension}`;
            downloadLink.textContent = `下載影片 (${fileExtension.toUpperCase()})`;
            
            progressContainer.style.display = 'none';
            resultContainer.style.display = 'block';
            startBtn.disabled = false;
            startBtn.textContent = '重新生成影片';
        };

        // 開始錄製
        mediaRecorder.start();

        // Canvas 動畫渲染迴圈
        function renderFrame(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            // 檢查是否已達到總時長，是則停止錄製
            if (elapsed >= totalDuration) {
                mediaRecorder.stop();
                return; 
            }

            const currentIndex = Math.floor(elapsed / durationPerImage);
            const timeInSlide = elapsed % durationPerImage;

            // 畫布塗黑 (背景)
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 動畫與過場邏輯 (Crossfade)
            if (timeInSlide < transitionTime) {
                if (currentIndex === 0) {
                    const alpha = timeInSlide / transitionTime;
                    drawImageLetterbox(loadedImages[currentIndex], alpha);
                } else {
                    const alpha = timeInSlide / transitionTime;
                    drawImageLetterbox(loadedImages[currentIndex - 1], 1 - alpha);
                    drawImageLetterbox(loadedImages[currentIndex], alpha);
                }
            } else if (currentIndex === loadedImages.length - 1 && timeInSlide > durationPerImage - transitionTime) {
                const alpha = (durationPerImage - timeInSlide) / transitionTime;
                drawImageLetterbox(loadedImages[currentIndex], alpha);
            } else {
                drawImageLetterbox(loadedImages[currentIndex], 1);
            }

            // 更新進度條
            const percent = Math.min(100, Math.floor((elapsed / totalDuration) * 100));
            progressBar.value = percent;
            progressText.innerText = percent + '%';

            animationId = requestAnimationFrame(renderFrame);
        }

        animationId = requestAnimationFrame(renderFrame);
    });
</script>

</body>
</html>
